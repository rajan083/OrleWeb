{# address_form.html #}
{% extends "base.html" %}
{% block title %}{{ 'Edit Address' if address else 'Add Address' }}{% endblock %}
{% block content %}
<div class="onboarding">
    <h1>{{ 'Edit address' if address else 'Add a new address' }}</h1>

    <form action="{{ url_for('address_edit', address_id=address.id) if address else url_for('address_add') }}" method="POST">
        <div class="field"><label>Full name</label><input type="text" name="full_name" value="{{ address.full_name if address else '' }}" required></div>

        <div style="display:flex; gap:16px;">
            <div class="field" style="flex:1;"><label>House / Flat No.</label><input type="text" name="house_number" value="{{ address.house_number if address else '' }}" required></div>
            <div class="field" style="flex:2;"><label>Street</label><input type="text" name="street" value="{{ address.street if address else '' }}" required></div>
        </div>

        <div class="field"><label>Area / Landmark (optional)</label><input type="text" name="area" value="{{ address.area if address else '' }}"></div>

        <div style="display:flex; gap:16px;">
            <div class="field" style="flex:1;"><label>City</label><input type="text" name="city" value="{{ address.city if address else '' }}" required></div>
            <div class="field" style="flex:1;"><label>District (optional)</label><input type="text" name="district" value="{{ address.district if address else '' }}"></div>
        </div>

        <div style="display:flex; gap:16px;">
            <div class="field" style="flex:1;"><label>State</label><input type="text" name="state" value="{{ address.state if address else '' }}" required></div>
            <div class="field" style="flex:1;"><label>PIN Code</label><input type="text" name="pincode" value="{{ address.pincode if address else '' }}" pattern="[0-9]{6}" maxlength="6" required></div>
        </div>

        <div class="field"><label>Phone</label><input type="tel" name="phone" value="{{ address.phone if address else '' }}" required></div>

        <label class="option-row" style="border:none; padding:8px 0;">
            <input type="checkbox" name="is_default" style="width:auto;" {{ 'checked' if address and address.is_default else '' }}>
            <span style="font-size:13px;">Set as default address</span>
        </label>
        <button type="submit" class="btn-save">{{ 'Save changes' if address else 'Add address' }}</button>
    </form>
</div>
{% endblock %}
