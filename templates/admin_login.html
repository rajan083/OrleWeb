{% extends "base.html" %}

{% block title %}Admin Login · ORLE{% endblock %}

{% block content %}

<div class="login-split">

    <div class="login-image-pane">
        <div class="login-image-ken-burns" style="background-image: url('{{ hero_image_url }}');"></div>
        <div class="login-image-scrim"></div>
        {% if hero_product_name %}
        <div class="login-image-caption">
            <span class="login-image-eyebrow">From the edit</span>
            <span class="login-image-product">{{ hero_product_name }}</span>
        </div>
        {% endif %}
    </div>

    <div class="form-wrapper login-form-wrapper">
        <div class="form-card">
            <div class="login-head-row">
                <h1 class="login-heading">ORLE Admin</h1>
                <a href="{{ url_for('dashboard') }}" class="login-skip">Skip</a>
            </div>

            <form method="POST" action="{{ url_for('admin_login') }}">
                <div class="login-fields-group">
                    <p class="login-signup-line">Restricted access — platform administrators only.</p>
                    <input type="email" name="email" placeholder="Email" required autofocus>
                    <input type="password" name="password" placeholder="Password" required>
                    <div class="form-links">
                        <a href="{{ url_for('login') }}">Customer login</a>
                        <a href="{{ url_for('vendor_login') }}">Vendor login</a>
                    </div>
                </div>
                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>

</div>
{% endblock %}
