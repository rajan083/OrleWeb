{% extends "base.html" %}
{% block title %}Vendor — Forgot Password{% endblock %}
{% block content %}
<div class="form-wrapper">
    <div class="form-card">
        <h2>Reset Vendor Password</h2>
        <p class="onboarding-sub">Enter the email associated with your vendor account. We'll send you a link to reset your password.</p>
        <form action="{{ url_for('vendor_forgot_password') }}" method="POST">
            <input type="email" name="email" placeholder="business@email.com" required>
            <button type="submit">Send Reset Link</button>
        </form>
        <p><a href="{{ url_for('vendor_login') }}" class="text-link">Back to Sign In</a></p>
    </div>
</div>
{% endblock %}
