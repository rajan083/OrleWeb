{% extends "base.html" %}
{% block title %}Vendor Registration{% endblock %}
{% block content %}

<div class="login-split">

    <div class="login-image-pane">
        <div class="login-image-ken-burns" style="background-image: url('{{ hero_image_url }}');"></div>
        <div class="login-image-scrim"></div>
        {% if hero_product_name %}
        <div class="login-image-caption">
            <span class="login-image-eyebrow">From the edit</span>
            <span class="login-image-product">{{ hero_product_name }}</span>
        </div>
        {% endif %}
    </div>

    <div class="form-wrapper login-form-wrapper">
        <div class="form-card">
            <div class="login-head-row">
                <h1 class="login-heading">VENDOR SIGN UP</h1>
                <a href="{{ url_for('home') }}" class="login-skip">Skip</a>
            </div>

            <form action="{{ url_for('vendor_register') }}" method="POST">
                <div class="login-fields-group">
                    <p class="login-signup-line">ALREADY REGISTERED? <a href="{{ url_for('vendor_login') }}">SIGN IN</a></p>
                    <input type="text" name="business_name" placeholder="Business name" required>
                    <input type="email" name="email" placeholder="business@email.com" required>
                    <input type="tel" name="phone_number" placeholder="Phone number">
                    <input type="password" name="password" placeholder="Password" required>
                    <input type="password" name="confirm_password" placeholder="Confirm password" required>
                </div>
                <button type="submit">Create vendor account</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
