{% extends "base.html" %}

{% block title %}SIGN UP-ORLE{% endblock %}

{% block content %}
<div class="login-split">

    <div class="login-image-pane">
        <div class="login-image-ken-burns" style="background-image: url('{{ hero_image_url }}');"></div>
        <div class="login-image-scrim"></div>
        {% if hero_product_name %}
        <div class="login-image-caption">
            <span class="login-image-eyebrow">From the edit</span>
            <span class="login-image-product">{{ hero_product_name }}</span>
        </div>
        {% endif %}
    </div>

    <div class="form-wrapper login-form-wrapper">
        <div class="form-card">
            <div class="login-head-row">
                <h1 class="login-heading">SIGN UP</h1>
                <a href="{{ url_for('dashboard') }}" class="login-skip">Skip</a>
            </div>

            <form action="{{ url_for('register', next=request.args.get('next')) }}" method="POST">
                <div class="login-fields-group">
                    <p class="login-signup-line">ALREADY A BUYER? <a href="{{ url_for('login', next=request.args.get('next')) }}">SIGN IN</a></p>
                    <input type="text" name="name" placeholder="Your Name" id="Name" required>
                    <input type="tel" name="phone_number" placeholder="Your Phone Number" id="Phone_Number">
                    <input type="email" name="email" placeholder="name@domain.com" id="Email" required autocomplete="email">
                    <input type="password" name="password" placeholder="•••••••••" id="Password" required>
                    <input type="password" name="confirm_password" placeholder="•••••••••" id="Confirm_Password" required>
                </div>
                <button type="submit">SUBMIT</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
