{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
<div class="onboarding">
    <h1>Checkout</h1>

    <div class="profile-card">
        {% for item in items %}
            <div class="option-row"><span>{{ item.product.name }} × {{ item.quantity }}</span><strong>₹{{ "{:,}".format(item.product.price * item.quantity) }}</strong></div>
        {% endfor %}
        <div class="option-row"><span>Total</span><strong>₹{{ "{:,}".format(total) }}</strong></div>
    </div>

    <form method="POST">
        <div class="field"><label>Full name</label><input type="text" name="shipping_name" required></div>
        <div class="field"><label>Address</label><input type="text" name="shipping_address" required></div>
        <div class="field"><label>Phone</label><input type="tel" name="shipping_phone" required></div>
        <button type="submit" class="btn-save">Place Order</button>
    </form>
</div>
{% endblock %}
