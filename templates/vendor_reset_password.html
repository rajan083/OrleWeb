{% extends "base.html" %}
{% block title %}Vendor — Reset Password{% endblock %}
{% block content %}
<div class="form-wrapper">
    <div class="form-card">
        <h2>Set a New Password</h2>
        <form action="{{ url_for('vendor_reset_password', token=token) }}" method="POST">
            <input type="password" name="password" placeholder="New password" required>
            <input type="password" name="confirm_password" placeholder="Confirm new password" required>
            <button type="submit">Reset Password</button>
        </form>
        <p><a href="{{ url_for('vendor_login') }}" class="text-link">Back to Sign In</a></p>
    </div>
</div>
{% endblock %}
